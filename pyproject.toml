[project]
name = "sphinxtales"
version = "0.1.0"
description = "Producao editorial assistida: IR, diagramacao e prepress"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "typst>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sphinxtales = "sphinxtales.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphinxtales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
